# Database connection string used by the containers (the `postgres` service on the compose network)
x-database-url: &database-url "postgresql://studycat:studycatPassword123!@postgres:5432/studycat?schema=public"

services:
  postgres:
    image: postgres:17-alpine
    container_name: studycat_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: studycat
      POSTGRES_PASSWORD: "studycatPassword123!"
      POSTGRES_DB: studycat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-off job run before `web`, `studio`, and `service` start: installs Node dependencies,
  # generates the Prisma client, and applies any pending database migrations.
  setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: studycat-web-dev:latest
    command: >-
      sh -c "pnpm install --frozen-lockfile --store-dir /pnpm-store
      && pnpm db:generate
      && pnpm db:migrate:deploy"
    environment: &web-env
      DATABASE_URL: *database-url
      FASTAPI_BASE_URL: "http://service:8000/v1"
    volumes: &web-volumes
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
      - pnpm_store:/pnpm-store
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js web app (http://localhost:3001).
  # Runs on 3001 inside the container too, since Next.js builds redirect URLs from its own port.
  web:
    image: studycat-web-dev:latest
    container_name: studycat_web
    # Uses webpack (--webpack) with polling rather than `pnpm dev` (Turbopack), since
    # Turbopack's file watcher does not detect host edits through a Docker Desktop bind mount.
    # No -H flag: next dev already listens on all interfaces, and setting -H 0.0.0.0
    # makes Next.js use 0.0.0.0 as the host in redirect URLs.
    command: pnpm exec next dev --webpack -p 3001
    environment:
      <<: *web-env
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes: *web-volumes
    depends_on:
      setup:
        condition: service_completed_successfully
      service:
        condition: service_started
    restart: unless-stopped

  # Prisma Studio database browser (http://localhost:5555)
  studio:
    image: studycat-web-dev:latest
    container_name: studycat_studio
    command: pnpm db:studio --hostname 0.0.0.0 --port 5555 --browser none
    ports:
      - "5555:5555"
    environment: *web-env
    volumes: *web-volumes
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Quiz engine service (http://localhost:8000/docs), built from a sibling checkout
  # of studycat-service. Set STUDYCAT_SERVICE_DIR to use a different location.
  service:
    build:
      context: ${STUDYCAT_SERVICE_DIR:-../studycat-service}
      dockerfile: Dockerfile.dev
    image: studycat-service-dev:latest
    container_name: studycat_service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ${STUDYCAT_SERVICE_DIR:-../studycat-service}/src:/app/src
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # OpenLDAP Directory Server (for Shibboleth IdP authentication)
  ldap:
    image: osixia/openldap:1.5.0
    container_name: studycat_ldap
    environment:
      LDAP_ORGANISATION: "StudyCAT"
      LDAP_DOMAIN: "studycat.local"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_TLS: "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      # Mount the WHOLE folder to the prepopulate directory
      - ./shibboleth/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    profiles: [ "shibboleth" ] # Only start with: docker compose --profile shibboleth up
    restart: unless-stopped

  # One-off service to initialize the Shibboleth IdP configuration (run once before first build)
  # Usage: docker compose --profile init run --rm idp-init
  idp-init:
    image: unicon/shibboleth-idp:3.4.3
    volumes:
      - ./shibboleth/idp:/ext-mount
    profiles: ["init"]
    command: init-idp.sh

  # Shibboleth Identity Provider (Mock IdP for SSO testing)
  idp:
    build: ./shibboleth/idp
    image: studycat-idp:latest
    container_name: studycat_idp
    ports:
      - "4443:4443" # Browser TLS (HTTPS)
      - "8443:8443" # Backchannel TLS
    environment:
      JETTY_BROWSER_SSL_KEYSTORE_PASSWORD: abc123
      JETTY_BACKCHANNEL_SSL_KEYSTORE_PASSWORD: abc123
      JETTY_MAX_HEAP: 1024m
    profiles: [ "shibboleth" ] # Only start with: docker compose --profile shibboleth up
    depends_on:
      - ldap
    restart: unless-stopped

  # Shibboleth Service Provider (Reverse proxy with SSO protection)
  sp:
    build: ./shibboleth/sp
    image: studycat-sp:latest
    container_name: studycat_sp
    ports:
      - "80:80" # HTTP (redirects to HTTPS)
      - "443:443" # HTTPS (main access point)
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allow SP to reach Next.js on host
      - "idp.studycat.local:host-gateway" # Allow SP to reach IdP via host port mapping
    environment:
      HOSTNAME: sp.studycat.local
      SERVICE_TO_PROTECT: host.docker.internal
      SERVICE_PORT: "3001"
      IDP_ENTITY_ID: https://idp.studycat.local/idp/shibboleth
      IDP_METADATA_URL: https://idp.studycat.local:4443/idp/shibboleth
      SUPPORT_EMAIL: admin@studycat.local
      SHIB_METADATA_BACKUP_URL: https://idp.studycat.local:4443/idp/shibboleth
      SHIB_DOWNLOAD_METADATA: "false" # Use local metadata file instead
    profiles: [ "shibboleth" ] # Only start with: docker compose --profile shibboleth up
    depends_on:
      - idp
    restart: unless-stopped
    volumes:
      # Mount the metadata
      - ./shibboleth/sp/config/idp-metadata.xml:/etc/shibboleth/metadata/idp-metadata.xml:ro

      # Mount the ACTUAL files (ensure these are files on your PC, not folders)
      - ./shibboleth/sp/certificates/sp-key.pem:/etc/shibboleth/sp-key.pem:ro
      - ./shibboleth/sp/certificates/sp-cert.pem:/etc/shibboleth/sp-cert.pem:ro

      # Mount the attribute map so you actually get user data
      - ./shibboleth/sp/config/attribute-map.xml:/etc/shibboleth/attribute-map.xml:ro

volumes:
  postgres_data:
  web_node_modules:
  web_next:
  pnpm_store:
  ldap_data:
  ldap_config:
