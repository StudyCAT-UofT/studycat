# Map Shibboleth attributes to HTTP headers for Next.js
RequestHeader set uid "%{uid}e" env=uid
RequestHeader set remote_user "%{REMOTE_USER}e" env=REMOTE_USER
RequestHeader set eppn "%{eppn}e" env=eppn
RequestHeader set mail "%{mail}e" env=mail
RequestHeader set displayname "%{displayName}e" env=displayName
RequestHeader set affiliation "%{affiliation}e" env=affiliation
RequestHeader set scoped-affiliation "%{scoped-affiliation}e" env=scoped-affiliation

# Debugging headers (optional, can be removed in production)
# RequestHeader set X-Shib-Debug "Enabled"
