# Pass the Next.js dev server's hot-reload websocket (/_next/hmr) through to the app.
# Without this, pages served by `next dev` through the SP never finish loading: the
# dev client waits for this websocket before hydrating. Production builds don't use it.
# Apache 2.4.29 has no ProxyPass upgrade=websocket option, so use mod_rewrite + mod_proxy_wstunnel.
# __BACKEND__ is replaced with $SERVICE_TO_PROTECT:$SERVICE_PORT when the container starts.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/_next/(.*)$ ws://__BACKEND__/_next/$1 [P,L]
