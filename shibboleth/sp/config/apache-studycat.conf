# StudyCAT Apache + Shibboleth SP Configuration
# Reverse proxy to Next.js app on localhost:3000

# Enable required modules
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule headers_module modules/mod_headers.so
# LoadModule ssl_module modules/mod_ssl.so

# Shibboleth SP module
# LoadModule mod_shib /usr/lib64/shibboleth/mod_shib_24.so

# Listen on port 443 for HTTPS
# Listen 443

<VirtualHost *:443>
    ServerName sp.studycat.local
    ServerAdmin admin@studycat.local

    # SSL Configuration
    SSLEngine on
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLCertificateFile /etc/shibboleth/sp-cert.pem
    SSLCertificateKeyFile /etc/shibboleth/sp-key.pem

    # Enable Shibboleth
    # ShibCompatWith24 On
    
    # Logging
    ErrorLog /var/log/httpd/studycat_error.log
    CustomLog /var/log/httpd/studycat_access.log combined
    
    # Log Shibboleth attributes for debugging
    # LogLevel info shib:debug

    # Shibboleth handler endpoints (don't proxy these)
    <Location /Shibboleth.sso>
        SetHandler shib
    </Location>

    # Shibboleth callback endpoint - MUST require authentication
    <Location /api/auth/shibboleth/callback>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require valid-user
        
        # Export Shibboleth attributes as HTTP headers
        ShibUseHeaders On
    </Location>

    # Protect the main application with Shibboleth
    # After login, users will be redirected here
    <Location />
        # Don't require Shibboleth for the root yet
        # We'll make specific routes require authentication
        AuthType None
        Require all granted
    </Location>

    # Require Shibboleth authentication for protected routes
    # Add more <LocationMatch> blocks as needed for different routes
    <LocationMatch "^/(quizzes|question-bank|students|analytics|upload|quiz)">
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require valid-user
        
        # Export Shibboleth attributes as HTTP headers
        # These headers will be passed to the Next.js app
        ShibUseHeaders On
    </LocationMatch>

    # Public routes (no authentication required)
    <Location /login>
        AuthType None
        Require all granted
    </Location>

    <Location /api/auth/mode>
        AuthType None
        Require all granted
    </Location>

    # Reverse Proxy Configuration
    # Forward all requests to Next.js app on localhost:3000
    ProxyPreserveHost On
    ProxyPass /Shibboleth.sso !
    ProxyPass / http://host.docker.internal:3000/
    ProxyPassReverse / http://host.docker.internal:3000/

    # Preserve and forward Shibboleth attributes as HTTP headers
    RequestHeader set X-Remote-User "%{REMOTE_USER}e" env=REMOTE_USER
    RequestHeader set X-Remote-Eppn "%{eppn}e" env=eppn
    RequestHeader set X-Remote-Uid "%{uid}e" env=uid
    RequestHeader set X-Remote-Mail "%{mail}e" env=mail
    RequestHeader set X-Remote-DisplayName "%{displayName}e" env=displayName
    RequestHeader set X-Remote-Affiliation "%{affiliation}e" env=affiliation
    RequestHeader set X-Remote-Scoped-Affiliation "%{scoped-affiliation}e" env=scoped-affiliation

    # Debugging: Log all headers being sent to backend
    # Remove in production
    # RequestHeader unset X-Debug-Headers
    # RequestHeader append X-Debug-Headers "%{ALL}e"

</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName sp.studycat.local
    Redirect permanent / https://sp.studycat.local/
</VirtualHost>
