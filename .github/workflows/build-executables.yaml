name: Build Python Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            label: canvasapi-script-linux-x64
          - os: windows-latest
            arch: x64
            label: canvasapi-script-windows-x64
          - os: macos-15-intel # Note that GitHub will deprecate this runner in August 2027
            arch: x64
            label: canvasapi-script-macos-intel
          - os: macos-14
            arch: arm64
            label: canvasapi-script-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv pip install --system pyinstaller -r scripts/canvasapi_script/canvasapi_script.py

      - name: Build executable
        run: pyinstaller --onefile --name "${{ matrix.label }}" scripts/canvasapi_script/canvasapi_script.py

      - name: Compress executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip "${{ matrix.label }}.zip" "${{ matrix.label }}"

      - name: Attach file to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
