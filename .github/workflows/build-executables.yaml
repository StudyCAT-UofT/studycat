name: Build Python Executables

on:
  push:
    branches: [main]
    paths:
      - 'scripts/canvasapi_script.py' 
      - '.github/workflows/build-executables.yaml'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install libraries
        run: pip install pyinstaller canvasapi click scipy beautifulsoup4 requests

      - name: Build executable
        run: pyinstaller --onefile scripts/canvasapi_script.py

      - name: Download file
        uses: actions/upload-artifact@v4
        with:
          name: py_executable_${{ matrix.os }}
          path: dist/*